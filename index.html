<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Accessibility checklists and brand kits: acceptance criteria, WCAG 2.2, disabilities and client branding for every component." />
    <title>Tessera accessible UI playbook</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&family=Nunito+Sans:wght@400;600;700&family=Source+Sans+3:wght@400;600;700&family=Work+Sans:wght@400;500;600;700&display=swap" />
  </head>
  <body>
    <div id="root"><p class="boot">Loading Tessera…</p></div>
    <noscript>This tool needs JavaScript to run.</noscript>
    <script>
      // If the app fails to start, show why instead of a blank page.
      window.addEventListener('error', function (e) {
        var r = document.getElementById('root');
        if (r && r.querySelector('.boot')) r.innerHTML = '<p class="boot boot--err">Tessera could not start: ' + String(e.message || 'unknown error').replace(/</g, '&lt;') + '</p>';
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
